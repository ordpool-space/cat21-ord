name: CI

on:
  push:
    branches:
    - master
  pull_request:
    branches:
    - master
  workflow_dispatch:

defaults:
  run:
    shell: bash

env:
  RUSTFLAGS: --deny warnings

jobs:
  docs:
    if: false # CAT-21 😺: disabled, we don't deploy upstream docs
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v5

    - name: Install Rust Toolchain Components
      uses: actions-rs/toolchain@v1
      with:
        override: true
        toolchain: 1.97.0  # CAT-21 😺: mirrors rust-toolchain.toml so CI can't drift onto a newer stable

    - uses: Swatinem/rust-cache@v2

    - name: Install `mdbook`
      run: cargo install mdbook@0.4.52

    - name: Install `mdbook-i18n-helpers`
      run: cargo install mdbook-i18n-helpers@0.3.6

    - name: Install `mdbook-linkcheck`
      run: cargo install mdbook-linkcheck@0.7.7

    - name: Build docs
      run: mdbook build docs -d build

    - name: Build all translations for docs
      env:
        LANGUAGES: de fr es pt ru zh ja ko fil ar hi it nl
      run: |
        for lang in ${{ env.LANGUAGES }}; do
          echo "::group::Building $lang translation"
          MDBOOK_BOOK__LANGUAGE=$lang \
            mdbook build docs -d build/$lang
          mv docs/build/$lang/html docs/build/html/$lang
          echo "::endgroup::"
        done

    - name: Deploy Pages
      uses: peaceiris/actions-gh-pages@v4
      if: github.ref == 'refs/heads/master'
      with:
        github_token: ${{secrets.GITHUB_TOKEN}}
        publish_branch: gh-pages
        publish_dir: docs/build/html

  lint:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v5

    - name: Install Rust Toolchain Components
      uses: actions-rs/toolchain@v1
      with:
        components: clippy, rustfmt
        override: true
        toolchain: 1.97.0  # CAT-21 😺: mirrors rust-toolchain.toml so CI can't drift onto a newer stable

    - uses: Swatinem/rust-cache@v2

    - name: Clippy
      run: cargo clippy --all --all-targets

    - name: Format
      run: cargo fmt --all -- --check

    - name: Check for Forbidden Words
      run: |
        sudo apt-get install ripgrep
        ./bin/forbid

  test:
    strategy:
      matrix:
        os:
        - macos-latest
        - ubuntu-latest
        - windows-latest

    runs-on: ${{matrix.os}}

    steps:
    - uses: actions/checkout@v5

    - name: Install Rust Toolchain Components
      uses: actions-rs/toolchain@v1
      with:
        profile: minimal
        toolchain: 1.97.0  # CAT-21 😺: mirrors rust-toolchain.toml so CI can't drift onto a newer stable

    - uses: Swatinem/rust-cache@v2

    # CAT-21 😺: windows retries up to 3x before hard-failing. Upstream ord's
    # integration harness races its ord server against bitcoind on the slow
    # windows runner ("N blocks behind bitcoind"), failing a different random
    # test each run. Retries absorb that transient flake; a persistent failure
    # (a real windows regression) still reds the build after the third attempt.
    # unix runs once so a genuine failure there reds immediately, no 3x wait.
    - name: Test
      run: |
        attempts=1
        [ "${{ matrix.os }}" = "windows-latest" ] && attempts=3
        for i in $(seq 1 "$attempts"); do
          echo "::group::cargo test --all (attempt $i/$attempts)"
          if cargo test --all; then
            echo "::endgroup::"
            exit 0
          fi
          echo "::endgroup::"
          echo "attempt $i/$attempts failed"
        done
        echo "cargo test --all failed after $attempts attempt(s)"
        exit 1
